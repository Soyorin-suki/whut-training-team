services:
  mysql:
    image: mysql:8.4
    container_name: whut-training-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: whut_dev_password
      MYSQL_DATABASE: whut_training
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pwhut_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:

