server:
  port: 8080

spring:
  application:
    name: training-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/whut_training?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:training}
    password: ${SPRING_DATASOURCE_PASSWORD:training123}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

codeforces:
  base_url: https://codeforces.com/api

app:
  logging:
    service:
      enabled: true
  codeforces:
    hard-problem-threshold: 2000
    user-stats-sync-enabled: ${APP_CODEFORCES_USER_STATS_SYNC_ENABLED:true}
    user-stats-sync-cron: "0 0 */6 * * *"
    user-stats-sync-zone: "Asia/Shanghai"
  auth:
    access-token-ttl-seconds: 1800
    refresh-token-ttl-seconds: 604800
  llm:
    default-provider: ${APP_LLM_DEFAULT_PROVIDER:}
    providers:
      default:
        type: ${APP_LLM_PROVIDER_TYPE:openai-compatible}
        base-url: ${APP_LLM_BASE_URL:}
        api-key: ${APP_LLM_API_KEY:}
        model: ${APP_LLM_MODEL:}
        timeout-seconds: ${APP_LLM_TIMEOUT_SECONDS:30}
  ai-problem:
    storage-root: ${APP_AI_PROBLEM_STORAGE_ROOT:./data/ai-problems}
  daily-problem:
    min-rating: 1200
    max-rating: 2000
    no-repeat-days: 90
    cache-ttl: ${APP_DAILY_PROBLEM_CACHE_TTL:1d}
    cron: "0 5 0 * * *"
    sync-cron: "0 0 0 * * MON"
    zone: "Asia/Shanghai"

logging:
  level:
    com.whut.training.interceptor.RequestLoggingInterceptor: INFO
    com.whut.training.aspect.logging.ServiceLogAspect: INFO
