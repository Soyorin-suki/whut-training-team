server:
  port: 8080

spring:
  application:
    name: training-backend
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:./data/training.db}

codeforces:
  base_url: https://codeforces.com/api

app:
  logging:
    service:
      enabled: true
  codeforces:
    hard-problem-threshold: 2000
    user-stats-sync-cron: "0 0 */6 * * *"
    user-stats-sync-zone: "Asia/Shanghai"
  auth:
    access-token-ttl-seconds: 1800
    refresh-token-ttl-seconds: 604800
  daily-problem:
    min-rating: 1200
    max-rating: 2000
    no-repeat-days: 90
    cron: "0 5 0 * * *"
    sync-cron: "0 0 0 * * MON"
    zone: "Asia/Shanghai"

logging:
  level:
    com.whut.training.interceptor.RequestLoggingInterceptor: INFO
    com.whut.training.aspect.logging.ServiceLogAspect: INFO
